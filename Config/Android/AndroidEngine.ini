[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
TargetSDKVersion=34
bMultiTargetFormat_ETC2=True
bMultiTargetFormat_DXT=False
bBuildForES31=False
bBuildForVulkan=True
bPackageDataInsideApk=True
Orientation=Portrait
bSupportsVulkan=True

; Android Texture Format Settings
[SystemSettings]
r.Android.DisableASTCSupport=False

; GPUSkin / SkinCache - GLSL ES3.1 sampler limit 16개 초과 방지
; TGPUSkinVertexFactoryUnlimited 퍼뮤테이션 Cook 억제
r.GPUSkin.UnlimitedBoneInfluences=0
r.SkinCache.CompileShaders=0

; SkyBox 머터리얼 렌더링 - Mobile Deferred에서 Sky Mesh 정상 표시
; Mobile Forward로 전환하여 Unlit Sky StaticMesh가 배경 패스에서 올바르게 렌더링되도록 함
r.Mobile.ShadingPath=0

; SkyBox HDR 텍스처 스트리밍 - TC_HDR_Compressed 포맷이 즉시 로드되도록 보장
r.Streaming.LimitPoolSizeToVRAM=0
